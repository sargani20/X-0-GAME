<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .status {
      font-size: 1.3rem;
      margin-bottom: 25px;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 20px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }

    /* Grid Layout */
    .game-container {
      position: relative;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .cell {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
    }

    .cell:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.03);
    }

    /* Player Colors */
    .cell.x {
      color: #ff4757;
      text-shadow: 0 0 15px #ff4757;
    }

    .cell.o {
      color: #2ed573;
      text-shadow: 0 0 15px #2ed573;
    }

    /* WINNING LINE CSS */
    .winning-line {
      position: absolute;
      background: #ff4757;
      box-shadow: 0 0 15px #ff4757, 0 0 25px #ff4757;
      border-radius: 5px;
      transition: all 0.4s ease-in-out;
      pointer-events: none;
      z-index: 10;
    }

    /* Control Buttons */
    .btn {
      margin-top: 30px;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: #ff4757;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #ff6b81;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6);
    }
  </style>
</head>
<body>

  <h1>Tic Tac Toe</h1>
  <div class="status" id="status">Player <span style="color:#ff4757">X</span>'s Turn</div>

  <div class="game-container">
    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>
    <!-- Winning Line Element -->
    <div id="winningLine" class="winning-line"></div>
  </div>

  <button class="btn" onclick="resetGame()">Restart Game</button>

  <script>
    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('status');
    const lineElement = document.getElementById('winningLine');

    let boardState = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let isGameActive = true;

    // Winning Combinations
    const winPatterns = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
      [0, 4, 8], [2, 4, 6]             // Diagonals
    ];

    // Click Event Listener
    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const index = cell.getAttribute('data-index');

        if (boardState[index] !== "" || !isGameActive) return;

        // Board update
        boardState[index] = currentPlayer;
        cell.innerText = currentPlayer;
        cell.classList.add(currentPlayer.toLowerCase());

        checkResult();
      });
    });

    // Check Win/Draw
    function checkResult() {
      let roundWon = false;
      let winningPattern = null;
      

      for (let pattern of winPatterns) {
        let [a, b, c] = pattern;
        if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
          roundWon = true;
          winningPattern = pattern;
          break;
        }
      }

      if (roundWon) {
        statusText.innerHTML = `Player <span style="color:${currentPlayer === 'X' ? '#ff4757' : '#2ed573'}">${currentPlayer}</span> Wins! 🎉`;
        isGameActive = false;
        drawWinningLine(winningPattern); // Winning line draw karna
        return;
      }

      if (!boardState.includes("")) {
        statusText.innerText = "Game Draw! 🤝";
        isGameActive = false;
        return;
      }

      // Turn Change
      currentPlayer = currentPlayer === "X" ? "O" : "X";
      const color = currentPlayer === 'X' ? '#ff4757' : '#2ed573';
      statusText.innerHTML = `Player <span style="color:${color}">${currentPlayer}</span>'s Turn`;
    }

    // Dynamic Winning Line Renderer
    function drawWinningLine(pattern) {
      const cellA = cells[pattern[0]].getBoundingClientRect();
      const cellC = cells[pattern[2]].getBoundingClientRect();
      const boardRect = document.getElementById('board').getBoundingClientRect();

      const x1 = cellA.left + cellA.width / 2 - boardRect.left;
      const y1 = cellA.top + cellA.height / 2 - boardRect.top;
      const x2 = cellC.left + cellC.width / 2 - boardRect.left;
      const y2 = cellC.top + cellC.height / 2 - boardRect.top;

      const distance = Math.hypot(x2 - x1, y2 - y1);
      const angle = Math.atan2(y2 - y1, x2 - x1) * (180 / Math.PI);

      lineElement.style.width = `${distance}px`;
      lineElement.style.height = `6px`;
      lineElement.style.left = `${x1}px`;
      lineElement.style.top = `${y1}px`;
      lineElement.style.transformOrigin = `0 50%`;
      lineElement.style.transform = `rotate(${angle}deg)`;
      lineElement.style.display = 'block';
    }

    // Reset Game
    function resetGame() {
      boardState = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      isGameActive = true;
      statusText.innerHTML = `Player <span style="color:#ff4757">X</span>'s Turn`;

      lineElement.style.display = 'none';

      cells.forEach(cell => {
        cell.innerText = "";
        cell.classList.remove('x', 'o');
      });
    }
  </script>
</body>
</html>
